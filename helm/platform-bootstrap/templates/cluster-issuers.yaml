# Let's Encrypt ClusterIssuers. Ingress should use cert-manager.io/cluster-issuer: "letsencrypt-prod" or "letsencrypt-staging".
# The names `letsencrypt-staging` and `letsencrypt-prod` are referenced by Ingress annotations
# elsewhere in the repo — renaming requires updating those references too.
{{- $email := required "acmeEmail is required: set it in values.yaml or pass --set acmeEmail=you@example.com" .Values.acmeEmail }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: {{ $email | quote }}
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ $email | quote }}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: traefik
