# Argo CD Application to install external-dns via Helm.
# Enable by adding this file to external-dns/kustomization.yaml resources.
# Create the external-dns namespace and provider secret (e.g. CF_API_TOKEN) before sync.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  source:
    chart: external-dns
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: "6.14.2"
    helm:
      values: |
        provider: cloudflare
        # domainFilters: ["example.com"]
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: api-token
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
