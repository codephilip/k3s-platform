# Template for the app-secrets Secret consumed by charts/example-app
# (via `envFromSecret.enabled: true` in values).
#
# DO NOT commit a populated copy. Either:
#   - Copy this file to app-secrets.yaml, fill it in, and apply manually (file is gitignored), or
#   - Run: ./scripts/create-app-secrets-from-env.sh dev   (reads .env.local)
#
# The secret name `app-secrets` and namespace `dev-apps` are referenced by chart values and
# the helper script — keep them in sync if you rename.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev-apps
type: Opaque
stringData: {}
  # Examples — replace with your own keys/values:
  # DATABASE_URL: "postgres://user:pass@host:5432/db"
  # STRIPE_SECRET_KEY: "sk_test_..."
  # OPENAI_API_KEY: "sk-..."
