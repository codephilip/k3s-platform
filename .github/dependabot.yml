# Automated dependency updates for Terraform providers and GitHub Actions.
# Weekly cadence — bumps for things that change rarely, batched so PR noise is bounded.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  - package-ecosystem: terraform
    directory: /terraform/hetzner
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(terraform)"

  - package-ecosystem: terraform
    directory: /terraform/cloudflare
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(terraform)"
